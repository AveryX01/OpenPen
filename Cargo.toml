[package]
name = "openpen"
default-run = "OpenPen"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37.0"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_Devices_HumanInterfaceDevice", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[[bin]]
name = "OpenPen"
path = "src/main.rs"
